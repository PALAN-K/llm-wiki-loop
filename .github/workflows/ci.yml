name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-cli-check:
    name: Lint & CLI Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax Linting
        run: |
          npm run lint
          node bin/cli.js --help

  test-matrix:
    name: Test Matrix (${{ matrix.os }} - Node ${{ matrix.node-version }} - Py ${{ matrix.python-version }})
    needs: lint-and-cli-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['18.x', '20.x']
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit & E2E Lifecycle Tests (Python)
        run: |
          python -m unittest discover -s tests

      - name: CLI Doctor & Self-Vault Verification
        run: |
          node bin/cli.js doctor
          node bin/cli.js check .
