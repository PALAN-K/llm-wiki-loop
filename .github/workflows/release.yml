name: Release & Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-test:
    name: Verify Before Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify tag matches package.json version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          echo "Tag: $TAG  Package: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Sync version to docs
        run: npm run sync:version

      - name: Run Checks (strict)
        run: |
          npm run lint
          npm test
          node bin/cli.js check --strict .
          npm pack --dry-run
          npm pack --dry-run 2>&1 | grep -q "__pycache__" && (echo "::error::__pycache__ in tarball" && exit 1) || echo "✓ Tarball clean"

      - name: Publish to NPM
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
